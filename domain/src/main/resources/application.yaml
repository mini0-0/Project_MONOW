spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/monow_test
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect