plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}


dependencies {
	implementation project(':global')
	implementation project(':domain')
	implementation project(':external')

	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.retry:spring-retry'
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'

}

bootJar { enabled = true }
jar { enabled = false }

tasks.register('syncDartCorpCodes', JavaExec) {
	group = 'application'
	description = 'Synchronizes Open DART corporation codes once.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set('com.monow.batch.dart.corpcode.StockCorpCodeSyncCommand')
}

tasks.register('collectDartDisclosures', JavaExec) {
	group = 'application'
	description = 'Collects and stores Open DART disclosure metadata.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set('com.monow.batch.dart.disclosure.DartDisclosureCollectionCommand')
}

tasks.register('downloadDartDisclosure', JavaExec) {
	group = 'application'
	description = 'Downloads the original ZIP for a stored Open DART disclosure.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set('com.monow.batch.dart.document.DartDocumentDownloadCommand')
}
